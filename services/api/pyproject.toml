[project]
name = "afrosite-api"
version = "0.1.0"
description = "FastAPI backend service for Afrosite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "pyjwt[crypto]>=2.13.0",
    "pwdlib[argon2]>=0.3.1",
    "httpx>=0.28.1",
    "alembic>=1.19.2",
    "email-validator>=2.3.0",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["afrosite_api"]
