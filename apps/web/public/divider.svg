<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 26" role="presentation" aria-hidden="true">
  <defs>
    <pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M12 0 L24 12 L12 24 L0 12 Z" fill="none" stroke="#C1502E" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="1"/>
      <stop offset="1"   stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1280" height="26" fill="url(#fade)"/></mask>
    <style>
      .l{opacity:.28;animation:drift 24s linear infinite}
      @media (prefers-color-scheme:dark){ .l path, .l rect{stroke:#E27E55} #d path{stroke:#E27E55} }
      @media (prefers-reduced-motion:reduce){ .l{animation:none} }
      @keyframes drift{to{transform:translateX(24px)}}
    </style>
  </defs>
  <g mask="url(#m)"><g class="l"><rect x="-24" y="1" width="1328" height="24" fill="url(#d)"/></g></g>
</svg>
