sonar.projectKey=Souraka229_AI-FOR-AFRICA-SMEs-Digita
sonar.organization=souraka229

# Reference / design assets are not application source; exclude from quality gate.
sonar.exclusions=brand/**,docs/**/*.html,**/node_modules/**,**/.next/**

# Test scaffolding and generated-style fixtures inflate CPD without adding risk.
sonar.cpd.exclusions=**/tests/**,**/migrations/versions/**,infra/gates/**/*.rego

# Local uv workspace packages must be built (editable); lockfile is frozen in CI.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/**
sonar.issue.ignore.multicriteria.e2.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e2.resourceKey=.github/workflows/**

sonar.python.version=3.12
