name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JS lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  python:
    name: Python lint / typecheck / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Ruff check
        run: uv run ruff check services packages/llm

      - name: Ruff format check
        run: uv run ruff format --check services packages/llm

      - name: Mypy
        run: uv run mypy services/api/afrosite_api packages/llm/afrosite_llm
        continue-on-error: true

      - name: Pytest
        run: uv run pytest
