name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build web preview artifact
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.15.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and build web
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @afrosite/web build

      - name: Upload web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-preview-${{ github.event.pull_request.number }}
          path: apps/web/.next
          retention-days: 7

      - name: Preview placeholder note
        run: |
          echo "Preview artifact built for PR #${{ github.event.pull_request.number }}."
          echo "Coolify auto-preview wiring comes in a later infra task."
