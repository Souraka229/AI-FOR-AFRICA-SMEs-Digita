# Socle local SERGE — playbook §6.1 / §16
# Pas de Temporal / API / web ici : le hackathon tourne dans apps/web.
# Usage : docker compose -f infra/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: afrosite
      POSTGRES_PASSWORD: afrosite_dev
      POSTGRES_DB: afrosite
    ports:
      - "5432:5432"
    volumes:
      - afrosite_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrosite -d afrosite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - afrosite_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: afrosite
      MINIO_ROOT_PASSWORD: afrosite_dev_minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - afrosite_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  afrosite_pg:
  afrosite_redis:
  afrosite_minio:
